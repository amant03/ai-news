name: Data Health Check

# Basic automation every 8 hours: validates the site's data is fresh and
# complete, and cross-checks the live sources (Artificial Analysis,
# OpenRouter) for drift. Read-only — commits nothing. A red run notifies
# the repo owner via GitHub's built-in Actions failure email.
on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

concurrency:
  group: ai-news-data-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run data health check
        run: npx tsx scripts/check-data.ts
