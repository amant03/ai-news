name: Daily Newsletter Digest

# Sends the "one email a day" digest (top 5 stories + biggest model release)
# via Resend's free tier. Needs RESEND_API_KEY + RESEND_FROM as repo secrets;
# without them the script dry-runs (prints, sends nothing) and still succeeds.
on:
  schedule:
    # 02:30 UTC = 08:00 IST every morning.
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: ai-news-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send digest
        run: npx tsx scripts/send-digest.mts
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
