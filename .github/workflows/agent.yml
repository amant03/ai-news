name: AI News Agent

# Free-tier news refresh on GitHub Actions (private repo: 2,000 min/month).
# A slim run is ~2–4 min × 6/day ≈ 500 min/month — well under the free cap.
# Vercel Hobby cron cannot run every 4h (daily only); this workflow is the 4h clock.
#
# Intentionally skips the heavy models/AA/T2I crawls (those used to fail after
# the agent and skip the news commit). A slim OpenRouter-only model catalog is
# still written every run (data/models-slim.json) so new model releases surface.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated source keys (rss,google-news,hackernews,reddit,arxiv,youtube,github,web,twitter). Leave empty for all."
        required: false
        type: string
  # An extra run when scraper/agent code changes, so a push can prove the job is green.
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent.yml"
      - "lib/twitter.ts"

concurrency:
  group: ai-news-agent
  cancel-in-progress: false

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run news agent
        id: agent
        timeout-minutes: 18
        run: npx tsx lib/run-agent.ts --skip-models --skip-ollama ${{ github.event.inputs.sources && format('--sources {0}', github.event.inputs.sources) || '' }}
        env:
          AGENT_MODE: ci
          AGENT_SKIP_MODELS: "true"
          X_SCRAPING: "true"
          OLLAMA_URL: ""

      - name: Refresh coding-agents board
        timeout-minutes: 5
        continue-on-error: true
        run: npx tsx lib/run-coding-agents.ts

      # Commit on `always()`, not only on success: the store writes are atomic,
      # so whatever a partial/failed run persisted is still worth shipping.
      # Without this, one timed-out run discards all fresh items and the site
      # goes stale until the next green run (the 6-8h gaps seen in Sep 2026).
      - name: Commit news snapshot
        if: always()
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          AGENT_OUTCOME="${{ steps.agent.outcome }}"
          node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('data/status.json','utf8'));
            const now = new Date().toISOString();
            d.lastRun = now;
            if (process.env.AGENT_OUTCOME === 'success') d.lastSuccess = now;
            const today = new Date();
            const hours = [0, 4, 8, 12, 16, 20];
            const nextHour = hours.find(h => h > today.getUTCHours()) ?? 24;
            const next = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate() + (nextHour === 24 ? 1 : 0), nextHour === 24 ? 0 : nextHour, 0, 0));
            d.nextRun = next.toISOString();
            fs.writeFileSync('data/status.json', JSON.stringify(d, null, 2));
            console.log('Updated status.json: outcome=' + process.env.AGENT_OUTCOME + ' nextRun=' + d.nextRun);
          "
          git add data/news.json data/status.json data/models-slim.json data/aa-models.json data/coding-agents.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: refresh AI news $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Push races (two runs, or a dev push landing mid-run) used to fail
            # the whole workflow — retry the pull/rebase/push cycle instead.
            for i in 1 2 3; do
              git pull --rebase origin main || true
              if git push origin HEAD:main; then break; fi
              echo "Push attempt $i failed, retrying..."
              sleep 15
            done
          fi
