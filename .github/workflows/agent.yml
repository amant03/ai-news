name: AI News Agent

on:
  schedule:
    # Every 4 hours
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated source keys (rss,google-news,hackernews,reddit,arxiv,youtube,github,web,twitter). Leave empty for all."
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: ai-news-agent
  cancel-in-progress: false

env:
  # puppeteer is a runtime dep but X scraping is disabled in CI — skip Chromium download entirely.
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run agent
        run: npx tsx lib/run-agent.ts --kb ${{ github.event.inputs.sources && format('--sources {0}', github.event.inputs.sources) || '' }}
        env:
          AGENT_MODE: ci
          # X scraping is blocked from datacenter IPs; keep CI fast.
          DISABLE_X_SCRAPING: "true"
          OLLAMA_URL: ""

      - name: Commit fresh data
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/models.json data/status.json AI_NEWS_KNOWLEDGE_BASE.md
          git commit -m "chore: refresh AI news $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes to commit"
          git fetch origin main
          git rebase origin/main --autostash || echo "Rebase skipped (up to date)"
          git push origin HEAD:main || echo "Push skipped (no changes or conflict)"
