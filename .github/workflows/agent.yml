name: AI News Agent

# Free-tier news refresh on GitHub Actions (private repo: 2,000 min/month).
# A slim run is ~2–4 min × 6/day ≈ 500 min/month — well under the free cap.
# Vercel Hobby cron cannot run every 4h (daily only); this workflow is the 4h clock.
#
# Intentionally skips the heavy models/AA/T2I crawls (those used to fail after
# the agent and skip the news commit). A slim OpenRouter-only model catalog is
# still written every run (data/models-slim.json) so new model releases surface.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated source keys (rss,google-news,hackernews,reddit,arxiv,youtube,github,web,twitter). Leave empty for all."
        required: false
        type: string
  # An extra run when scraper/agent code changes, so a push can prove the job is green.
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent.yml"
      - "lib/twitter.ts"

concurrency:
  group: ai-news-agent
  cancel-in-progress: false

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run news agent
        id: agent
        timeout-minutes: 12
        run: npx tsx lib/run-agent.ts --skip-models --skip-ollama ${{ github.event.inputs.sources && format('--sources {0}', github.event.inputs.sources) || '' }}
        env:
          AGENT_MODE: ci
          AGENT_SKIP_MODELS: "true"
          X_SCRAPING: "true"
          OLLAMA_URL: ""

      - name: Commit news snapshot
        if: steps.agent.outcome == 'success'
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('data/status.json','utf8'));
            d.lastRun = new Date().toISOString();
            d.lastSuccess = new Date().toISOString();
            const now = new Date();
            const hours = [0, 4, 8, 12, 16, 20];
            const nextHour = hours.find(h => h > now.getUTCHours()) ?? 24;
            const next = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + (nextHour === 24 ? 1 : 0), nextHour === 24 ? 0 : nextHour, 0, 0));
            d.nextRun = next.toISOString();
            fs.writeFileSync('data/status.json', JSON.stringify(d, null, 2));
            console.log('Updated status.json: nextRun=' + d.nextRun);
          "
          git add data/news.json data/status.json data/models-slim.json data/aa-models.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: refresh AI news $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
