name: AI News Agent

# Free-tier news refresh. Intentionally does NOT scrape models/AA/T2I:
# those used to run after the agent and fail, which skipped the news commit
# (`if: success()`), leaving the site stale. models.json is also ~96MB and
# must never be part of this job.
on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated source keys (rss,google-news,hackernews,reddit,arxiv,youtube,github,web,twitter). Leave empty for all."
        required: false
        type: string

concurrency:
  group: ai-news-agent
  cancel-in-progress: false

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run news agent
        id: agent
        timeout-minutes: 8
        run: npx tsx lib/run-agent.ts --kb --skip-models --skip-ollama ${{ github.event.inputs.sources && format('--sources {0}', github.event.inputs.sources) || '' }}
        env:
          AGENT_MODE: ci
          AGENT_SKIP_MODELS: "true"
          DISABLE_X_SCRAPING: "true"
          OLLAMA_URL: ""

      - name: Commit news snapshot
        if: steps.agent.outcome == 'success'
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('data/status.json','utf8'));
            d.lastRun = new Date().toISOString();
            d.lastSuccess = new Date().toISOString();
            const now = new Date();
            const hours = [0, 6, 12, 18];
            const nextHour = hours.find(h => h > now.getUTCHours()) ?? 24;
            const next = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + (nextHour === 24 ? 1 : 0), nextHour === 24 ? 0 : nextHour, 30, 0));
            d.nextRun = next.toISOString();
            fs.writeFileSync('data/status.json', JSON.stringify(d, null, 2));
            console.log('Updated status.json: nextRun=' + d.nextRun);
          "
          git add data/news.json data/status.json AI_NEWS_KNOWLEDGE_BASE.md
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: refresh AI news $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:main
          fi
