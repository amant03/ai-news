name: AI News Agent

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated source keys (rss,google-news,hackernews,reddit,arxiv,youtube,github,web,twitter). Leave empty for all."
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: ai-news-agent
  cancel-in-progress: false

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run agent
        timeout-minutes: 15
        run: npx tsx lib/run-agent.ts --kb ${{ github.event.inputs.sources && format('--sources {0}', github.event.inputs.sources) || '' }}
        env:
          AGENT_MODE: ci
          DISABLE_X_SCRAPING: "true"
          OLLAMA_URL: ""

      - name: Refresh T2I leaderboard
        timeout-minutes: 5
        run: npx tsx lib/t2i-scraper.ts

      - name: Enrich model data from AA
        timeout-minutes: 20
        run: npx tsx lib/aa-model-scraper.ts

      - name: Commit and push fresh data
        if: success()
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/models.json data/status.json data/aa-models.json data/t2i-models.json data/image-editing-models.json data/text-to-video-models.json data/image-to-video-models.json data/video-editing-models.json data/speech-to-text-models.json data/text-to-speech-models.json AI_NEWS_KNOWLEDGE_BASE.md
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: refresh AI news $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:main
          fi
